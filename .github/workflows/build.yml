name: Build EXE

on:
  push:
    branches: [ "main", "основной", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Fix Code Layout
      run: |
        python -c "
        with open('main.py', 'r', encoding='utf-8') as f:
            lines = f.readlines()
        with open('main.py', 'w', encoding='utf-8') as f:
            for line in lines:
                if 'def show_settings' in line:
                    f.write('    def show_settings(self):\n        pass\n')
                elif 'if __name__ ==' in line or 'if name ==' in line:
                    f.write('if __name__ == \"__main__\":\n')
                else:
                    f.write(line)
        "

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --collect-all customtkinter main.py

    - name: Upload Ready EXE
      uses: actions/upload-artifact@v4
      with:
        name: PC-Guardian-EXE
        path: dist/main.exe
